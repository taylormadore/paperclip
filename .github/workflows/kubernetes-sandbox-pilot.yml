name: Kubernetes sandbox pilot artifacts

on:
  push:
    branches: [codex/kubernetes-sandbox-v1beta1]
    paths:
      - packages/plugins/sandbox-providers/kubernetes/**
      - docker/agent-runtime/Dockerfile.codex-kubectl
      - .github/workflows/kubernetes-sandbox-pilot.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kubernetes-sandbox-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin:
    if: github.repository == 'taylormadore/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install locked plugin dependencies
        run: npm ci --prefix packages/plugins/sandbox-providers/kubernetes --ignore-scripts --no-audit --no-fund
      - name: Test plugin
        run: npm test --prefix packages/plugins/sandbox-providers/kubernetes
      - name: Typecheck against deployed Paperclip SDK
        run: npm run typecheck --prefix packages/plugins/sandbox-providers/kubernetes
      - name: Build and verify standalone plugin
        run: node packages/plugins/sandbox-providers/kubernetes/scripts/build-plugin-artifact.mjs --out /tmp/plugin-artifact
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish plugin artifact
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: /tmp/plugin-artifact
          file: packages/plugins/sandbox-providers/kubernetes/Dockerfile.artifact
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/taylormadore/paperclip-plugin-kubernetes:git-${{ github.sha }}
            ghcr.io/taylormadore/paperclip-plugin-kubernetes:0.1.0-pilot.2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Plugin image: `ghcr.io/taylormadore/paperclip-plugin-kubernetes@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  runtime:
    if: github.repository == 'taylormadore/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Codex and kubectl runtime
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/agent-runtime/Dockerfile.codex-kubectl
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/taylormadore/paperclip-agent-runtime-codex-kubectl:git-${{ github.sha }}
            ghcr.io/taylormadore/paperclip-agent-runtime-codex-kubectl:pilot-2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Runtime image: `ghcr.io/taylormadore/paperclip-agent-runtime-codex-kubectl@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
